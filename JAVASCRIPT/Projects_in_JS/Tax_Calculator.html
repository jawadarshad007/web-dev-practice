<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black; color: white; font-size: 20px; text-align: center;">
    <div id="parent">    
        <h1>Income Tax Calculator</h1>
        <form action="">
            <input type="number" id="income" name="icome" placeholder="Enter your income">
            <br> <br>
            <button type="submit">calculate Tax</button>
        </form>
        <h2>Income Tax: </h2>
    </div>
</body>

<script>
    const form = document.querySelector("form");
    form.addEventListener("submit", (e)=>{
        e.preventDefault();
        const income = document.querySelector("#income")
        const amount = parseInt(income.value)
        
        
        const result = document.querySelector('h2')
        let totalTax = 0;
        if(amount<=600000){
            totalTax = 0;
        }
        else if(amount<=1200000){
            totalTax = (amount-600000) * 0.01
         }
        else if(amount<=2200000){
            totalTax = (amount-1200000) * 0.11  + 6000;
         }
        else if(amount<=3200000){
            totalTax = (amount-2200000) * 0.20  + 116000;
         }
         result.textContent = `Total Tax: ${totalTax}`
         form.reset();
    })
</script>
</html>
