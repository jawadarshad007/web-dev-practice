<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0056b3;
        }
        #note {
            margin-top: 30px;
            padding: 15px 25px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            min-width: 200px;
            min-height: 30px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>
    <button>Add Note</button>
    <p id="note"></p>
<script>

    // if (localStorage.getItem("name")){
    //     let a = localStorage.getItem("name");
    //     document.write("Hello " + a);
    // }
    // else{
    //     let a  = prompt("Enter your name:");
    //     localStorage.setItem("name" , a);
    //     document.write("Hello " + a);
    // }



    // let a ={
    //     "Harry" : 1,
    //     "Jawad" : 2,
    // }
    // // JSON.stringify() => convert object into string
    // localStorage.setItem("guys" , JSON.stringify(a));
    // // JSON.parse() => convert string into object
    // console.log(JSON.parse(localStorage.getItem("guys")));





    let p = document.querySelector("#note");

    function saveNoteToLocalStorage(note){
        localStorage.setItem("note", note)
        p.innerHTML= note
    }

    let note =  localStorage.getItem("note")
    if (note){
        p.innerHTML= note
    }
    
    document.querySelector("button").addEventListener("click" , ()=> {
        let note = prompt("Enter your note")
        saveNoteToLocalStorage(note)
    })
</script>
</body>
</html>
